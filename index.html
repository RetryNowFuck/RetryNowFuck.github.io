<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로마자 - 바이에버 문자 변환기</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>바이에버 문자 변환기</h1>
        <p class="subtitle">로마자를 입력하면 바이에버 문자로 변환되어 보여집니다.</p>
        
        <!-- 선택기 탭: 변환할 문자를 고르는 UI -->
        <div class="selector" id="scriptSelector">
            <div class="option selected" data-script="byever" id="optByever">바이에버 문자</div>
            <div class="option" data-script="plain" id="optPlain">원문</div>
        </div>

        <div class="input-area">
            <label for="inputText">로마자 입력 (English Only):</label>
            <textarea id="inputText" placeholder="로마자를 입력해주세요."></textarea>
        </div>

        <div class="output-area">
            <label id="outputLabel">바이에버 문자 출력 (Byever Script):</label>
            <div id="outputText" class="byever-font"></div>
        </div>

        <div class="btn-group">
            <button id="copyBtn">결과 복사하기</button>
            <button id="clearBtn">초기화</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
